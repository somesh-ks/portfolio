name: CI

# Gates every PR and every push to main. Until the Next.js app lands, the app
# jobs detect the missing scaffold and skip cleanly; secret scanning always runs.
#
# Script contract (define these in package.json; any that are missing are skipped):
#   typecheck     tsc --noEmit
#   lint          oxlint
#   format:check  oxfmt --check
#   knip          knip (unused files, exports, deps)
#   test          bun test
#   build         next build
#   size          bundle size budget, runs after build
#   test:e2e      Playwright + axe, runs only when playwright.config.* exists
#
# Branch protection should require the single "CI passed" check.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  detect:
    name: Detect scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      app: ${{ steps.detect.outputs.app }}
      e2e: ${{ steps.detect.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          if [ -f package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No app yet::package.json not found; app checks skipped."
          fi
          if compgen -G "playwright.config.*" > /dev/null; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No e2e yet::playwright.config.* not found; e2e and a11y skipped."
          fi

  quality:
    name: Typecheck, lint, test, build
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads packageManager ("bun@x.y.z") from package.json when set.
          bun-version-file: package.json

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          set -euo pipefail
          has() { jq -e --arg s "$1" '.scripts[$s] // empty' package.json > /dev/null; }
          for script in typecheck lint format:check knip test build size; do
            if has "$script"; then
              echo "::group::bun run $script"
              bun run "$script"
              echo "::endgroup::"
            else
              echo "::notice title=Skipped $script::No \"$script\" script in package.json."
            fi
          done

  e2e:
    name: E2E and accessibility
    needs: detect
    if: needs.detect.outputs.app == 'true' && needs.detect.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Cache Bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Build
        run: bun run build

      - name: Run e2e + axe
        run: |
          if jq -e '.scripts["test:e2e"] // empty' package.json > /dev/null; then
            bun run test:e2e
          else
            bunx playwright test
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif"

  required:
    name: CI passed
    needs: [detect, quality, e2e, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' > /dev/null; then
            echo "::error::One or more required jobs failed."
            exit 1
          fi
