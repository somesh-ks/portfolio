# Fast local gates. CI runs the full set (see .github/workflows/ci.yml).
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,json,css,md,mdx,yml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}
pre-push:
  jobs:
    - name: check
      run: bun run check
